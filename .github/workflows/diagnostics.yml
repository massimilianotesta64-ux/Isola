name: diagnostics
on:
  push:
    branches: [diagnostics]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: |
          cd diag && npm init -y >/dev/null && npm pkg set type=module && npm i onnxruntime-node@1.23.2 playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Download models
        run: |
          cd diag && mkdir -p m
          curl -sSL -o m/kramp.onnx https://huggingface.co/kramp/htdemucs-6s-webgpu-onnx/resolve/main/htdemucs_6s.onnx
          curl -sSL -o m/aw_s78.onnx https://huggingface.co/Andremi/audioweb-models/resolve/main/demucs_htdemucs_6s_s78_fp16w_ca.onnx
          curl -sSL -o m/aw_s39.onnx https://huggingface.co/Andremi/audioweb-models/resolve/main/demucs_htdemucs_6s_s39_fp16w_ca.onnx
          ls -la m
      - name: Equivalence vs official model
        continue-on-error: true
        run: cd diag && node equiv.mjs 2>&1 | grep -v cpuid | tee out-equiv.txt
      - name: Browser split (real model)
        continue-on-error: true
        run: |
          (python3 diag/serve.py &) ; sleep 1
          cd diag && timeout 1800 node browser2.mjs 2>&1 | tee out-browser2.txt
      - name: Save results
        if: always()
        run: |
          cd diag && rm -rf node_modules package*.json m song.wav
          git config user.name "isola-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add -A . && git commit -m "diagnostic results 3" && git push || true
